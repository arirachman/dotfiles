# tell tmux to load non-logi shell by default
set -g default-command "${SHELL}"


# unbind all keys, made tmux into a blank slate
## make it specific to unbind all keymaps: prefix, root, copy-mode, and copy-mode-vi
## -a option means all
## -T option here means keytable 
## unbind -a -T prefix
## unbind -a -T root
## unbind -a -T copy-mode
## unbind -a -T copy-mode-vi

# Change prefix from default C-b to alt+w
## -g option here is to set globally
set -g prefix M-w
## Press M-w the second time tmux won't treat it as tmux command
bind-key M-w send-prefix

# Reload the config easily with `prefix M-r`
## it re-executes every command, doesn't "reset" anything to its intial state. Reset one previous config requires undo the command in the next one
bind M-r source-file ~/.tmux.conf

# pick vim as key tables in tmux for copy mode. to switch to emacs, set `mode-keys emacs`
set -g mode-keys vi

# Set prefix-Space as keybind to enter copy-mode
bind Space copy-mode

# Escape copy mode using ESC key
bind -T copy-mode-vi Escape send -X cancel

# Navigate with vim-like keys in copy mode 
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi l send -X cursor-right

# Tell tmux to use the system clipboard natively via OSC 52
set -s set-clipboard on

# "trace" the text I want to select and yank with v and y just like vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel 

# "but i like my mouse"
set -g mouse on

# Allow mouse to operate in copy-mode
## this suppposed to allow mouse to scroll in copy-mode, but doesn't work. We'll look at it later
bind -T copy-mode-vi WheelUpPane { select-pane; send-keys -X -N 5 scroll-up }
bind -T copy-mode-vi WheelDownPane { select-pane; send-keys -X -N 5 scroll-down }
## outside copy-mode, draggingmouse will enter copy mode and begin selection inside the copy-mode
bind -n MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
## releasing the mousedrag will copy the selection and will leave the seletion visible, which is cool
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear





# tell tmux that cli app is ok using Tc, because tmux is strictly using basic color by default
## set the default terminal mode to 256color mode
set-option -g default-terminal "screen-256color"
## pass through TC for any app that has 256col
set -ga terminal-overrides ",screen-256color:Tc"

# Set delay time after hit ESC to 0 ms, because tmux gives delay time by default for ESC sequence such as ESC[A
set -s escape-time 0

# bind-key C-a send-prefix
set -g status-style 'bg=#333333 fg=#5eacd3'

# set base index 1 instead of 0, so creating window for the first time will name it to 1
set -g base-index 1


# vim-like pane switching
## -r flag stands for repeatable. you don't need to press prefix again to perform the command
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R




# CONTEXT-AWARE SHORTCUTS
## Open to-do list in a new window using neovim, insipred by primeagen
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/TODO.md"

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind-key -r G run-shell "~/.local/bin/tmux-sessionizer ~/work/nrdp"
bind-key -r C run-shell "~/.local/bin/tmux-sessionizer ~/work/tvui"
bind-key -r R run-shell "~/.local/bin/tmux-sessionizer ~/work/milo"
# bind-key -r L run-shell "~/.local/bin/tmux-sessionizer ~/work/hpack"
bind-key -r H run-shell "~/.local/bin/tmux-sessionizer ~/personal/vim-with-me"
bind-key -r T run-shell "~/.local/bin/tmux-sessionizer ~/personal/refactoring.nvim"
bind-key -r N run-shell "~/.local/bin/tmux-sessionizer ~/personal/harpoon"
bind-key -r S run-shell "~/.local/bin/tmux-sessionizer ~/personal/developer-productivity"

# feedback showing prefix active when it is
set -g status-right "#{?client_prefix,#[fg=red]#[bg=black] PREFIX #[default],} %H:%M %d-%b-%y"
